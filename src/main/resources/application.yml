server:
  port: 8080
  # 本地默认只监听回环地址，避免开发口令/接口暴露到局域网；容器内由环境变量改为 0.0.0.0。
  address: ${AICS_BIND_ADDRESS:127.0.0.1}
  # 默认不信任客户端自带的 X-Forwarded-*；生产容器只允许本机 Caddy 访问时显式启用 FRAMEWORK。
  forward-headers-strategy: ${AICS_FORWARD_HEADERS_STRATEGY:NONE}

aics:
  # 32 字节随机值的 Base64；用于加密管理后台写入数据库的 API Key/Secret。
  # 生产环境必填，密钥本身绝不能写入数据库或提交到仓库。
  config-encryption-key: ${AICS_CONFIG_ENCRYPTION_KEY:}
  # 仅新库首次启动或替换历史默认密码时使用；成功启动后应从环境中删除。
  bootstrap-admin-password: ${AICS_BOOTSTRAP_ADMIN_PASSWORD:}
  # 企微图文卡片的缩略图需要公网绝对地址；生产环境必填（WeComKfService 启动时 fail-fast 校验）。
  public-base-url: ${AICS_PUBLIC_BASE_URL:}

spring:
  application:
    name: ai-customer-service
  # 后台/admin 等静态页面禁用浏览器缓存：redeploy 后浏览器一定拉取新版，
  # 避免旧 admin.html 的详情浮层 null 崩溃导致整页白屏的"缓存假象"。
  # 用 cachecontrol.no-store（标准且稳定生效），而非 never-cache。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  # PostgreSQL + pgvector 连接配置（对应 docker-compose.yml）
  datasource:
    url: jdbc:postgresql://localhost:5432/aics
    username: postgres
    # 开发兜底密码 postgres123（与 docker-compose.yml 一致）；生产由环境变量 POSTGRES_PASSWORD 覆盖
    password: ${POSTGRES_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  # 上传文件大小限制（知识库文档）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # schema.sql 已停用；数据库结构只通过 db/migration/V* 版本化演进。
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 旧部署没有 flyway_schema_history：先标记为 0，再执行幂等 V1 基线。
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
  # 第 8~9 周：Redis（短期记忆缓存）
  data:
    redis:
      host: localhost
      port: 6379

# 图片本地存储目录（发送图片功能，相对项目根目录）
file:
  upload-dir: uploads

# 腾讯地图 WebService（需求文档第五章：地图API优先对接腾讯）。
# 门店管理输入地址自动解析经纬度（geocoder）；key 在 lbs.qq.com 申请（免费额度），未配置则跳过解析。
map:
  tencent:
    key: ""

# ========== 企业微信「微信客服」可选配置 ==========
# 多企业凭证、回调密钥与 open_kfid 统一在管理后台“企微企业”中加密保存，
# application.yml 不再接受旧版全局凭证，避免误把所有企业共用一套密钥。
wecom:
  kf:
    asr-region: ${WECOM_ASR_REGION:ap-guangzhou}

# 第 24 周：健康检查端点（探活/监控抓取用）。
# 默认 health 自动检查数据源与 Redis 连通性——任一挂即 DOWN，外部据此摘流量/告警。
management:
  server:
    # 管理端独立端口：/actuator/**（含无鉴权的 prometheus 指标）不再出现在应用端口 8080 上，
    # 公网即使经反向代理也读不到模型名称/调用量/token 等运营信息；8080 只保留业务接口。
    # 绑定地址跟随 AICS_BIND_ADDRESS（本地 127.0.0.1，生产容器 0.0.0.0——
    # 生产侧再由 compose 只把 8081 发布到宿主机回环地址，公网不可达）。
    port: ${AICS_MANAGEMENT_PORT:8081}
    address: ${AICS_MANAGEMENT_BIND_ADDRESS:${AICS_BIND_ADDRESS:127.0.0.1}}
  endpoints:
    web:
      exposure:
        # P2-10：prometheus 端点暴露 JVM/HTTP/连接池 + AI 网关自定义指标（aics_*），供外部 Prometheus 抓取
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
