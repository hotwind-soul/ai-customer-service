<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 · AI 运营后台</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/admin-theme.css">
<link rel="stylesheet" href="/css/admin-page.css">
</head>
<body>
<!-- a11y：跳过链接（W26：WCAG 2.4.1） -->
<a class="skip-link" href="#main-content">跳到主内容</a>
<div id="app" v-cloak>
  <!-- W26-M1：登录页（替代浏览器 prompt 输入口令） -->
  <div v-if="!token" class="login-wrap">
    <div class="login-box">
      <div class="login-badge">昇</div>
      <h1>智能客服 · AI 运营后台</h1>
      <p class="login-sub">AI 知识、素材、调试与质量管理</p>
      <div v-if="loginErr" class="login-err" role="alert">{{ loginErr }}</div>
      <form @submit.prevent="doLogin">
        <label class="field-label" for="admin-username">管理员账号</label>
        <input id="admin-username" v-model="loginUsername" autocomplete="username" placeholder="请输入管理员或超级管理员账号">
        <label class="field-label" for="admin-password">密码</label>
        <input id="admin-password" v-model="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码">
        <button class="login-submit" type="submit">进入后台</button>
      </form>
    </div>
  </div>
  <template v-else>
  <div class="admin-shell">
    <button v-if="navOpen" type="button" class="admin-backdrop" aria-label="关闭后台导航" @click="navOpen=false"></button>
    <aside class="admin-sidebar" :class="{open:navOpen}">
      <div class="admin-brand"><span class="admin-brand-badge">昇</span><div><strong>AI 运营中心</strong><span>智能客服</span></div></div>
      <nav class="admin-nav" aria-label="后台功能导航">
        <section v-for="group in tabGroups" :key="group.name" class="nav-group">
          <h2 class="nav-group-title" role="button" tabindex="0"
              :aria-expanded="!collapsedGroups[group.name]"
              @click="toggleGroup(group.name)"
              @keydown.enter.prevent="toggleGroup(group.name)"
              @keydown.space.prevent="toggleGroup(group.name)">
            <span class="nav-caret" :class="{collapsed: collapsedGroups[group.name]}"></span>
            {{ group.name }}
          </h2>
          <button v-for="t in group.items" v-show="!collapsedGroups[group.name]" :key="t.key" type="button" :class="{active:tab===t.key}" :aria-current="tab===t.key ? 'page' : null" @click="switchTab(t.key)">{{ t.name }}</button>
        </section>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-role"><span>{{ currentUser.name || currentUser.username }}</span><span class="role-pill">{{ roleLabel }}</span></div>
        <button type="button" @click="toggleTheme" :aria-label="isDark ? '切换到浅色模式' : '切换到深色模式'">{{ isDark ? '☀ 浅色' : '☾ 深色' }}</button>
        <button type="button" @click="resetToken">退出登录</button>
      </div>
    </aside>
    <section class="admin-workspace" id="main-content" tabindex="-1">
      <header class="admin-toolbar">
        <button type="button" class="admin-menu" aria-label="打开后台导航" @click="navOpen=true">☰</button>
        <div class="admin-toolbar-title"><h1>{{ currentTab.name }}</h1></div>
        <a class="btn btn-plain admin-help-link" :href="currentHelpUrl" target="_blank" rel="opener" title="打开当前模块的使用说明">帮助中心 ↗</a>
      </header>
      <main class="container">
    <div v-if="toast" class="toast" role="status" aria-live="polite">{{ toast }}</div>

    <!-- 知识库 -->
    <div v-show="tab === 'kb'" class="card">
      <h2>知识库文档（共 {{ kb.totalChunks || 0 }} 片）</h2>
      <div class="kb-index-panel">
        <div class="kb-index-main">
          <span class="kb-index-icon" aria-hidden="true">↻</span>
          <div class="kb-index-copy">
            <strong>知识向量索引</strong>
            <div v-if="kbReindexTask" class="kb-index-status" role="status" aria-live="polite">
              <b :class="{failed:kbReindexTask.status==='failed'}">{{ kbReindexStatusText }}</b>
              <span v-if="Number(kbReindexTask.total_chunks || 0) > 0"> · {{ Number(kbReindexTask.processed_chunks || 0) }}/{{ Number(kbReindexTask.total_chunks || 0) }} 片</span>
              <span v-if="kbReindexTask.error" class="failed"> · {{ kbReindexTask.error }}</span>
              <div v-if="kbReindexRunning && Number(kbReindexTask.total_chunks || 0) > 0" class="kb-index-progress" aria-hidden="true"><span :style="{width: Math.min(100, Math.round(Number(kbReindexTask.processed_chunks || 0) / Number(kbReindexTask.total_chunks || 1) * 100)) + '%'}"></span></div>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" :disabled="kbReindexRunning" @click="reindexKb">{{ kbReindexRunning ? '正在重建…' : '重建全部向量' }}</button>
      </div>
      <div class="resource-scope-bar">
        <label><span>新资源所属企业</span><select v-model="resourceScope.tenantId" @change="onResourceTenantChange"><option value="">全局共享</option><option v-for="tenant in resourceScopeCatalog.tenants" :key="'kb-t-'+tenant.id" :value="String(tenant.id)">{{ tenant.name }}</option></select></label>
        <label><span>所属微信客服号</span><select v-model="resourceScope.kfAccountId" :disabled="!resourceScope.tenantId"><option value="">企业内全部客服号共享</option><option v-for="account in resourceAccounts" :key="'kb-k-'+account.id" :value="String(account.id)">{{ account.name }}</option></select></label>
        <div class="resource-scope-summary"><strong>当前归属：{{ selectedResourceScopeLabel }}</strong><br>下面新上传的文档会按该范围供 AI 检索；已有文档的归属不会被改变。</div>
      </div>
      <div class="form-row">
        <input type="file" ref="kbFile" aria-label="选择知识库文档">
        <button class="btn btn-primary" :disabled="uploadingKb" @click="uploadKb">{{ uploadingKb ? '上传中…' : '上传文档' }}</button>
        <span class="muted">支持 pdf / docx / xlsx / txt / md；price.xlsx 会批量导入项目中心，不调用向量模型</span>
      </div>
      <!-- 内容检索：按关键词即时查找切片（跨发布状态），不依赖向量模型 -->
      <div class="kb-search-bar">
        <input type="search" v-model="kbSearch" @keyup.enter="searchKbContent" aria-label="按关键词搜索知识库内容" placeholder="搜索知识库内容，如：退款、营业时间、禁忌">
        <button class="btn btn-primary" :disabled="kbSearching" @click="searchKbContent">{{ kbSearching ? '搜索中…' : '搜索' }}</button>
        <button v-if="kbSearchResults.length" class="btn btn-plain" @click="clearKbSearch">清除结果</button>
        <span v-if="kbSearchResults.length" class="muted">命中 {{ kbSearchResults.length }} 条切片</span>
      </div>
      <div v-if="kbSearchResults.length" class="kb-search-results">
        <div v-for="r in kbSearchResults" :key="r.id" class="kb-search-item" @click="jumpToSearchChunk(r)">
          <div class="kb-search-meta">
            <span class="kb-cat">{{ r.doc_name }}</span>
            <span class="muted">#{{ r.chunk_index }}</span>
            <span class="chip" :class="'status-' + (r.chunk_status || r.doc_status)">{{ docStatusLabel(r.chunk_status || r.doc_status) }}</span>
            <span v-if="r.knowledge_type" class="muted">{{ r.knowledge_type }}</span>
            <span v-if="r.governance_reason && r.governance_override" class="chip status-published">动态价格 · 人工启用</span>
            <span v-else-if="r.governance_reason" class="chip status-draft">动态价格 · 系统停用</span>
          </div>
          <div class="kb-search-snippet" v-html="kbHighlight(r.content)"></div>
        </div>
      </div>
      <table>
        <tr><th scope="col">文档名</th><th scope="col">归属</th><th scope="col">内容条数</th><th scope="col">操作</th></tr>
        <tr v-if="knowledgeDocuments.length === 0"><td colspan="4" class="empty-row">暂无文档 · 在上方选择文件点「上传文档」，AI 即可检索该内容</td></tr>
        <tr v-for="d in pagedKnowledgeDocuments" :key="d.id || (d.doc_name + '-' + d.tenant_id + '-' + d.kf_account_id)">
          <td>{{ d.doc_name }}</td>
          <td><span class="chip">{{ resourceScopeLabel(d) }}</span></td>
          <td>{{ d.chunk_count || 0 }}</td>
          <td>
            <button class="btn btn-primary" @click="openKbEditor(d)">编辑</button>
            <button class="btn btn-danger" @click="deleteKb(d)">删除</button>
          </td>
        </tr>
      </table>
      <div v-if="totalKbPages > 1" class="pager">
        <button class="btn btn-plain" :disabled="kbPage <= 1" @click="kbPage--">上一页</button>
        <span class="muted">第 {{ kbPage }} / {{ totalKbPages }} 页 · 共 {{ knowledgeDocuments.length }} 个文档</span>
        <button class="btn btn-plain" :disabled="kbPage >= totalKbPages" @click="kbPage++">下一页</button>
        <span class="page-jump">跳至 <input type="number" class="page-jump-input" v-model.number="jump.kb" min="1" :max="totalKbPages" @keyup.enter="gotoPage('kb','kbPage','totalKbPages')"> 页<button class="btn btn-plain" @click="gotoPage('kb','kbPage','totalKbPages')">前往</button></span>
      </div>

      <!-- 在线编辑器（浮层弹窗：点"编辑"即居中弹出，不用滚动到列表底部） -->
      <div v-if="kbEditDoc" class="kb-mask" @click.self="closeKbEditor">
        <div class="kb-modal" role="dialog" aria-modal="true" aria-label="知识库编辑器">
          <div class="kb-modal-head">
            <h2>正在编辑：《{{ kbEditDoc }}》（{{ kbChunks.length }} 条）</h2>
            <button class="btn btn-plain" @click="closeKbEditor">✕ 关闭</button>
          </div>
          <div class="kb-modal-body">
            <div v-for="c in pagedKbChunks" :key="c.id" class="kb-item" @keydown.ctrl.s.prevent="c.knowledge_type !== 'offer' && saveChunk(c)">
              <div class="kb-item-toolbar">
                <span class="muted">#{{ c.chunk_index }}</span>
                <span class="chip" :class="'status-' + c.status">{{ docStatusLabel(c.status) }}</span>
                <span class="chip">{{ c.knowledge_type === 'faq' ? 'FAQ' : (c.knowledge_type === 'offer' ? '结构化报价' : '参考资料') }}</span>
                <span v-if="c.governance_reason && c.governance_override" class="chip status-published">动态价格 · 人工启用</span>
                <span v-else-if="c.governance_reason" class="chip status-draft">动态价格 · 系统停用</span>
                <span v-if="kbChunkDirty(c)" class="kb-unsaved">● 有未保存修改</span>
                <span class="kb-item-spacer"></span>
                <button v-if="c.knowledge_type !== 'offer'" class="btn btn-primary" @click="saveChunk(c)">保存</button>
                <button v-if="c.knowledge_type !== 'offer' && c.status !== 'published'" class="btn btn-plain" @click="setChunkStatus(c, 'published')">{{ c.governance_reason ? '人工启用' : '启用' }}</button>
                <button v-else-if="c.knowledge_type !== 'offer'" class="btn btn-plain" @click="setChunkStatus(c, 'disabled')">停用</button>
                <button class="btn btn-plain" @click="openKbTest(c)">{{ kbTestChunkId === c.id ? '收起测试' : '测试效果' }}</button>
                <button v-if="c.knowledge_type === 'reference'" class="btn btn-plain" @click="kbPreviewId = (kbPreviewId === c.id ? '' : c.id)">{{ kbPreviewId === c.id ? '隐藏格式' : '格式预览' }}</button>
                <button v-if="c.knowledge_type !== 'offer'" class="btn btn-danger" @click="deleteChunk(c.id)">删除</button>
              </div>
              <div v-if="c.governance_reason" class="kb-governance-note">
                <strong>{{ c.governance_override ? '已由管理员人工启用：' : '系统建议停用：' }}</strong>{{ c.governance_reason }}。
                <span v-if="c.governance_override">该内容目前会参与客户检索；如价格变化，请及时更新或停用。</span>
                <span v-else>你可以修改内容后保存，也可以确认风险后点击“人工启用”。</span>
              </div>
              <div v-if="c.knowledge_type === 'faq'" class="kb-faq-editor">
                <label class="wide"><span>客户常见问题</span><input v-model="c.faq_question" maxlength="500" placeholder="例如：做完多久可以恢复？"></label>
                <label class="wide"><span>标准回答</span><textarea v-model="c.faq_answer" :rows="kbRows(c.faq_answer)" maxlength="10000" placeholder="填写明确、可审核的标准回答"></textarea></label>
                <label><span>项目 / 分类</span><input v-model="c.faq_category" maxlength="100" placeholder="例如：抗衰；可留空"></label>
              </div>
              <div v-else-if="c.knowledge_type === 'offer'" class="kb-test-hint" style="margin:0">
                结构化报价只读，请在“项目中心”维护。
              </div>
              <textarea v-else v-model="c.content" :rows="kbRows(c.content)" aria-label="参考资料内容" class="kb-textarea"></textarea>
              <div v-if="kbPreviewId === c.id && c.knowledge_type === 'reference'" class="kb-preview kb-format-preview" v-html="renderMd(c.content)"></div>

              <section v-if="kbTestChunkId === c.id" class="kb-test-panel" aria-label="知识效果测试">
                <div class="kb-test-head">
                  <div><strong>客户问题测试</strong><p>测试读取已保存内容；默认只检查路由和召回，不写会话、不创建业务数据。</p></div>
                  <button class="btn btn-plain" @click="closeKbTest">关闭</button>
                </div>
                <div class="kb-test-query">
                  <label><span>模拟客户问题</span><input v-model="kbTestQuestion" maxlength="1000" placeholder="输入客户可能会问的问题" @keyup.enter="runKbChunkTest(c, false)"></label>
                  <button class="btn btn-plain" :disabled="kbTestRunning" @click="runKbChunkTest(c, false)">{{ kbTestRunning ? '测试中…' : '只测试召回' }}</button>
                  <button class="btn btn-primary" :disabled="kbTestRunning" @click="runKbChunkTest(c, true)">{{ kbTestRunning ? '运行中…' : '生成最终回答' }}</button>
                </div>
                <div v-if="kbTestError" class="kb-test-hint" style="color:var(--danger)">{{ kbTestError }}</div>
                <template v-if="kbTestResult">
                  <div class="kb-test-summary">
                    <div class="kb-test-stat"><span>线上状态</span><strong>{{ c.status === 'published' && (c.has_embedding || c.knowledge_type === 'offer') ? '可参与回答' : '不会参与检索' }}</strong></div>
                    <div class="kb-test-stat"><span>最终路由</span><strong>{{ debugTypeName(kbTestResult.replyType) }}</strong></div>
                    <div class="kb-test-stat"><span>当前切片</span><strong>{{ kbActiveTestHit ? '召回第 ' + kbActiveTestHit.rank + ' 名' : '未召回' }}</strong></div>
                    <div class="kb-test-stat"><span>采用结果</span><strong>{{ kbActiveTestHit ? (kbActiveTestHit.accepted ? '已采用' : '已过滤') : '未进入候选' }}</strong></div>
                  </div>
                  <div v-if="['FACT','INTRO'].includes(kbTestResult.replyType) && !kbActiveTestHit" class="kb-test-hint">本次问题由项目中心实时数据优先处理，因此没有使用这条知识。</div>
                  <div v-else-if="kbTestResult.replyType === 'AI' && !kbTestResult.answer" class="kb-test-hint">知识检索和 Prompt 已完成，本次没有调用最终生成模型。点击“生成最终回答”可查看客户实际回复。</div>
                  <div v-if="kbTestResult.answer" class="kb-test-answer"><strong style="display:block;margin-bottom:5px">客户实际回复</strong>{{ kbTestResult.answer }}</div>
                  <div v-else-if="kbTestResult.routeSummary" class="kb-test-answer">{{ kbTestResult.routeSummary }}</div>
                  <details v-if="kbTestResult.turnTrace" class="quality-trace"><summary>查看权威来源与决策追踪</summary><pre>{{ formatDecisionTrace(kbTestResult.turnTrace) }}</pre></details>
                  <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
                    <span class="muted">候选 {{ (kbTestResult.hits || []).length }} 条 · 采用 {{ kbTestResult.acceptedCount || 0 }} 条 · {{ kbTestResult.durationMs || 0 }} ms</span>
                    <button v-if="role === 'super_admin' || permissions.includes('ai.debug')" class="btn btn-plain" @click="openKbTestInLab">在调优中心查看同次结果</button>
                  </div>
                </template>
              </section>
            </div>
            <div v-if="totalKbChunkPages > 1" class="pager">
              <button class="btn btn-plain" :disabled="kbChunkPage <= 1" @click="kbChunkPage--">上一页</button>
              <span class="muted">第 {{ kbChunkPage }} / {{ totalKbChunkPages }} 页 · 共 {{ kbChunks.length }} 条</span>
              <button class="btn btn-plain" :disabled="kbChunkPage >= totalKbChunkPages" @click="kbChunkPage++">下一页</button>
              <span class="page-jump">跳至 <input type="number" class="page-jump-input" v-model.number="jump.kbChunk" min="1" :max="totalKbChunkPages" @keyup.enter="gotoPage('kbChunk','kbChunkPage','totalKbChunkPages')"> 页<button class="btn btn-plain" @click="gotoPage('kbChunk','kbChunkPage','totalKbChunkPages')">前往</button></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 项目中心：项目、价格、别名、图片和门店的唯一维护入口 -->
    <div v-show="tab === 'projects'" class="card">
      <div class="settings-title-row">
        <div><h2>项目中心（主项目 {{ projectRootCount }} · 子项目 {{ projectSubprojectCount }}）</h2></div>
        <button class="btn btn-primary" @click="openNewProject">＋ 新增项目</button>
      </div>
      <div class="resource-scope-bar">
        <label><span>新项目所属企业</span><select v-model="resourceScope.tenantId" @change="onResourceTenantChange"><option value="">全局共享</option><option v-for="tenant in resourceScopeCatalog.tenants" :key="'project-t-'+tenant.id" :value="String(tenant.id)">{{ tenant.name }}</option></select></label>
        <label><span>所属微信客服号</span><select v-model="resourceScope.kfAccountId" :disabled="!resourceScope.tenantId"><option value="">企业内全部客服号共享</option><option v-for="account in resourceAccounts" :key="'project-k-'+account.id" :value="String(account.id)">{{ account.name }}</option></select></label>
        <div class="resource-scope-summary"><strong>当前归属：{{ selectedResourceScopeLabel }}</strong><br>仅影响新建项目；编辑已有项目不会改变归属。</div>
      </div>
      <table>
        <tr><th>项目</th><th>归属</th><th>别名</th><th>当前价格</th><th>图片</th><th>门店</th><th>状态</th><th>操作</th></tr>
        <tr v-if="serviceProjects.length === 0"><td colspan="8" class="empty-row">暂无项目 · 点右上角「＋ 新增项目」建立第一个项目（名称 + 别名 + 价格）</td></tr>
        <tr v-for="project in serviceProjects" :key="project.id" :class="{'project-row-child':project.parentId}">
          <td><div class="project-name-cell"><span v-if="project.parentId" class="project-branch" aria-hidden="true">↳</span><div class="project-name-copy"><div class="project-name-line"><strong>{{ project.name }}</strong><span class="project-kind" :class="{child:project.parentId}">{{ project.parentId ? '子项目' : '主项目' }}</span></div><span v-if="project.parentId" class="project-parent-copy">归入 {{ project.parentName || '主项目 #' + project.parentId }}</span><span class="muted">{{ project.code }}</span></div></div></td>
          <td><span class="chip">{{ resourceScopeLabel(project) }}</span></td>
          <td class="ellipsis-wide" :title="(project.aliases || []).join('、')">{{ (project.aliases || []).join('、') }}</td>
          <td>{{ project.offer && project.offer.activityPrice != null ? project.offer.activityPrice + ' 元' : '待维护' }}</td>
          <td>{{ (project.imageIds || []).length }} 张</td><td>{{ (project.storeIds || []).length }} 家</td>
          <td><span class="ai-status" :class="project.status === 'published' ? 'matched' : (project.status === 'disabled' ? 'failed' : 'pending')">{{ projectStatusLabel(project.status) }}</span></td>
          <td><button class="btn btn-plain" @click="startProjectEdit(project)">编辑</button><button v-if="project.status !== 'disabled'" class="btn btn-danger" @click="disableProject(project)">停用</button></td>
        </tr>
      </table>

      <div v-if="projectDialog" class="kb-mask" tabindex="-1" @click.self="closeProjectEditor" @keydown.esc="closeProjectEditor">
        <form class="kb-modal project-editor" role="dialog" aria-modal="true" aria-labelledby="project-editor-title" @submit.prevent="saveProject">
          <header class="project-editor-head">
            <div class="project-editor-title">
              <span class="project-editor-mark">项目</span>
              <div><h2 id="project-editor-title">{{ projectDraft.id ? '编辑项目' : '新增项目' }}</h2></div>
            </div>
            <button type="button" class="btn btn-plain project-editor-close" :disabled="projectSaving" @click="closeProjectEditor"><span aria-hidden="true">×</span> 关闭</button>
          </header>

          <div class="project-editor-shell">
            <nav class="project-editor-nav" aria-label="项目编辑分区">
              <button type="button" class="project-editor-tab" :class="{active:projectEditorTab==='basic'}" @click="projectEditorTab='basic'">
                <span class="project-editor-step">01</span><span><strong>基本信息</strong><small>名称、编码、状态、别名</small></span><span class="project-editor-count">{{ projectAliasList.length }}</span>
              </button>
              <button type="button" class="project-editor-tab" :class="{active:projectEditorTab==='offer'}" @click="projectEditorTab='offer'">
                <span class="project-editor-step">02</span><span><strong>报价与话术</strong><small>价格、订金、标准回复</small></span><span class="project-editor-count">{{ projectDraft.offer.activityPrice || '—' }}</span>
              </button>
              <button type="button" class="project-editor-tab" :class="{active:projectEditorTab==='resources'}" @click="projectEditorTab='resources'">

                    <label class="project-field project-col-6"><span>服务范围 / 包含部位</span><textarea v-model="projectDraft.serviceScope" maxlength="2000" rows="4" placeholder="例如：具体包含哪些部位、哪些区域；未确认时请留空"></textarea><small class="project-field-hint">留空表示未发布服务范围</small></label>

                        <label class="project-status-option" :class="{selected:projectDraft.status==='published'}"><input type="radio" value="published" v-model="projectDraft.status"><span><strong>已发布</strong><small>主项目显示首页；子项目参与识别并使用自己的报价</small></span></label>

                    </div>
                  </div>
                </div>
                <div class="project-form-card">
                  <label class="project-field"><span>项目别名</span></label>

                  <div class="project-form-grid">

                  </div>
                </div>
                <div class="project-form-card">
                  <div class="project-copy-grid">
                    <label class="project-field"><span>简短价格回复</span><textarea v-model="projectDraft.offer.briefCopy" maxlength="1000" placeholder="例如：淡斑活动价198元，8元订金可抵扣，到店再付190元。"></textarea><small class="project-field-hint">{{ String(projectDraft.offer.briefCopy || '').length }}/1000 · 留空时系统根据金额自动生成</small></label>
                    <label class="project-field"><span>首次项目介绍</span><textarea v-model="projectDraft.offer.saleCopy" maxlength="5000" placeholder="填写顾客首次咨询该项目时发送的完整介绍话术，可分段输入。"></textarea><small class="project-field-hint">{{ String(projectDraft.offer.saleCopy || '').length }}/5000</small></label>
                  </div>
                </div>
              </section>

              <section v-show="projectEditorTab==='resources'" class="project-section" aria-labelledby="project-resources-title">
                <div class="project-section-head">
                  <div><h3 id="project-resources-title">关联素材与门店</h3></div>

                </div>
                <div class="project-resources-grid">
                  <div class="project-resource-panel">
                    <div class="project-resource-head"><div><strong>项目图片</strong><span>已选 {{ projectDraft.imageIds.length }}</span></div><div class="project-resource-actions"><button type="button" @click="selectFilteredProjectImages">全选当前结果</button><button type="button" @click="projectDraft.imageIds=[]">清空</button></div></div>
                    <div class="project-search-wrap"><input type="search" class="project-search" v-model.trim="projectImageSearch" placeholder="搜索图片名称或类型" aria-label="搜索项目图片"></div>
                    <div v-if="filteredProjectImages.length" class="project-resource-list">
                      <label v-for="img in filteredProjectImages" :key="'pa-'+img.id" class="project-resource-option" :class="{selected:projectDraft.imageIds.includes(Number(img.id)),unavailable:img.enabled===false}">

                      </label>
                    </div>
                    <div v-else class="project-resource-empty">没有找到匹配的图片素材</div>

                      <label class="project-store-filter"><span>城市</span><select v-model="projectStoreCity" aria-label="按城市筛选支持门店" @change="onProjectStoreCityChange"><option value="">全部城市（{{ projectStores.length }}）</option><option v-for="city in projectStoreCities" :key="'store-city-'+city" :value="city">{{ city }}（{{ projectStoreCountByCity(city) }}）</option></select></label>
                      <label class="project-store-filter"><span>区 / 县</span><select v-model="projectStoreDistrict" aria-label="按区县筛选支持门店" :disabled="!projectStoreCity || !projectStoreDistricts.length"><option value="">{{ !projectStoreCity ? '请先选择城市' : (projectStoreDistricts.length ? '全部区 / 县' : '该城市未设置区县') }}</option><option v-for="district in projectStoreDistricts" :key="'store-district-'+district" :value="district">{{ district }}（{{ projectStoreCountByDistrict(district) }}）</option></select></label>

                      <label v-for="store in filteredProjectStores" :key="'ps-'+store.id" class="project-resource-option store" :class="{selected:projectDraft.storeIds.includes(Number(store.id))}">
                        <input type="checkbox" v-model="projectDraft.storeIds" :value="Number(store.id)">

                        <span class="project-resource-copy"><strong>{{ store.name }}</strong><small>{{ store.address || (store.city + ' · 地址待完善') }}</small></span>
                      </label>
                    </div>
                    <div v-else class="project-resource-empty">{{ projectStoreCity ? '当前城市或区县没有匹配门店，请切换地区或清除搜索词' : '没有找到匹配的门店' }}</div>
                  </div>
                </div>
              </section>
            </main>
          </div>

          <footer class="project-editor-footer">
            <div class="project-editor-footer-actions"><button type="button" class="btn btn-plain" :disabled="projectSaving" @click="closeProjectEditor">取消</button><button type="submit" class="btn btn-primary project-save-btn" :disabled="projectSaving || !String(projectDraft.name || '').trim()">{{ projectSaving ? '正在保存…' : '保存并同步全部入口' }}</button></div>
          </footer>
        </form>
      </div>
    </div>

    <!-- 结构化事实（AI 回答的唯一事实源） -->
    <div v-show="tab === 'facts'" class="card">
      <h2>结构化事实（共 {{ facts.length }} 条）</h2>
      <p class="muted">价格、营业时间、禁忌等权威事实在这里维护。AI 回答时优先引用「已发布」且在有效期内的事实；保存后立即生效，无需重建向量索引。发布状态必须填写内容。</p>
      <div class="form-row">
        <input type="search" v-model="factsFilter" aria-label="筛选事实" placeholder="按键名 / 项目 / 内容筛选，如：价格、营业">
        <span class="muted">命中 {{ filteredFacts.length }} 条</span>
      </div>
      <table>
        <tr><th scope="col">键名</th><th scope="col">项目</th><th scope="col">类型</th><th scope="col">状态</th><th scope="col">内容</th><th scope="col">有效期</th><th scope="col">操作</th></tr>
        <tr v-if="filteredFacts.length === 0"><td colspan="7" class="empty-row">暂无事实记录</td></tr>
        <tr v-for="f in filteredFacts" :key="f.fact_key">
          <td class="mono">{{ f.fact_key }}</td>
          <td>{{ f.project || '—' }}</td>
          <td>{{ f.fact_type }}</td>
          <td><span class="chip" :class="'status-' + f.status">{{ factStatusLabel(f.status) }}</span></td>
          <td class="fact-cell">{{ f.display_text || '—' }}</td>
          <td class="muted">{{ factValidity(f) }}</td>
          <td>
            <button class="btn btn-primary" @click="openFactEditor(f)">编辑</button>
          </td>
        </tr>
      </table>

      <!-- 事实编辑弹窗 -->
      <div v-if="factEdit" class="kb-mask" @click.self="factEdit = null">
        <div class="kb-modal" role="dialog" aria-modal="true" aria-label="事实编辑器">
          <div class="kb-modal-head">
            <h2>编辑事实：{{ factEdit.fact_key }}</h2>
            <button class="btn btn-plain" @click="factEdit = null">✕ 关闭</button>
          </div>
          <div class="kb-modal-body">
            <div class="kb-item">
              <div class="kb-faq-editor">
                <label class="wide"><span>项目</span><input v-model="factEdit.project" maxlength="100" placeholder="关联项目名，可留空"></label>
                <label class="wide"><span>事实类型</span><input v-model="factEdit.fact_type" maxlength="50" placeholder="如 price / business_hours / taboo"></label>
                <label class="wide"><span>状态</span>
                  <select v-model="factEdit.status">
                    <option value="draft">草稿（不参与回答）</option>
                    <option value="published">已发布（AI 引用）</option>
                    <option value="disabled">已停用</option>
                  </select>
                </label>
                <label class="wide"><span>对客户展示的内容（发布状态必填）</span><textarea v-model="factEdit.display_text" rows="4" maxlength="2000" placeholder="填写权威、准确的事实表述"></textarea></label>
                <label class="wide"><span>来源说明</span><input v-model="factEdit.source" maxlength="200" placeholder="该事实的依据，如：已确认的活动价政策"></label>
                <label class="wide"><span>审核人</span><input v-model="factEdit.reviewer" maxlength="50" placeholder="填写审核人姓名/账号"></label>
                <label class="wide"><span>生效时间（可留空=立即长期生效）</span><input type="datetime-local" v-model="factEdit.valid_from"></label>
                <label class="wide"><span>失效时间（可留空=长期有效）</span><input type="datetime-local" v-model="factEdit.valid_until"></label>
              </div>
            </div>
          </div>
          <div class="kb-modal-head" style="border-top:1px solid var(--line);border-bottom:none;padding:12px 16px;">
            <span></span>
            <div style="display:flex;gap:8px">
              <button class="btn btn-plain" @click="factEdit = null">取消</button>
              <button class="btn btn-primary" :disabled="factSaving" @click="saveFact">{{ factSaving ? '保存中…' : '保存' }}</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 图片素材 -->
    <div v-show="tab === 'img'" class="card">

        <label><span>所属微信客服号</span><select v-model="resourceScope.kfAccountId" :disabled="!resourceScope.tenantId"><option value="">企业内全部客服号共享</option><option v-for="account in resourceAccounts" :key="'img-k-'+account.id" :value="String(account.id)">{{ account.name }}</option></select></label>
        <div class="resource-scope-summary"><strong>当前归属：{{ selectedResourceScopeLabel }}</strong><br>下面新上传的效果图和海报只会在对应企业/客服号的对话中匹配。</div>
      </div>

        <input type="file" ref="imgFile" accept="image/*" aria-label="选择图片素材">

        <input type="text" v-model="imgTags" aria-label="图片标签" placeholder="标签（空格分隔），如：眼袋 对比图 案例">
      </div>
      <div class="form-row img-meta-row">
        <select v-model="imgProject" aria-label="所属项目">
          <option value="">选择所属项目</option>
          <option v-for="project in publishedProjectOptions" :key="'img-project-'+project" :value="project">{{ project }}</option>
        </select>

          <span class="switch"><input type="checkbox" v-model="imgEnabled" aria-label="启用"><span class="slider"></span></span>
          <span class="switch-text">启用<span class="muted">（上传后客户可在对话中收到）</span></span>
        </label>
        <button class="btn btn-primary upload-btn" :disabled="uploadingImg" @click="uploadImg">{{ uploadingImg ? '上传中…' : '上传图片' }}</button>
      </div>
      <div v-if="imgType === 'promo'" class="form-row">
        <label>生效时间 <input type="datetime-local" v-model="imgValidFrom" aria-label="海报生效时间"></label>

        <span class="muted img-promo-note">不填表示立即生效或长期有效；过期后不会自动发送</span>

        <select v-model="imgTagFilter" aria-label="按图片标签筛选" style="padding:8px;border:1px solid var(--line);border-radius:6px">

          <option v-for="t in imgTagsAll" :key="t" :value="t">{{ t }}</option>

              <input type="text" v-model="imgEditName" aria-label="编辑图片名称" placeholder="图片名">

              <select v-model="imgEditProject" aria-label="编辑所属项目">
                <option value="">选择所属项目</option>
                <option v-for="project in publishedProjectOptions" :key="'img-edit-project-'+project" :value="project">{{ project }}</option>
              </select>
              <select v-model="imgEditType" aria-label="编辑图片类型">
                <option value="effect">效果图</option><option value="promo">优惠海报</option>
              </select>
              <label class="switch-field" title="关闭后该图片不会在对话中发给客户">
                <span class="switch"><input type="checkbox" v-model="imgEditEnabled" aria-label="启用"><span class="slider"></span></span>
                <span class="switch-text">启用<span class="muted">（在对话中可发送给客户）</span></span>
              </label>
            </div>
            <div v-if="imgEditType === 'promo'" class="form-row">
              <label>生效时间 <input type="datetime-local" v-model="imgEditValidFrom"></label>
              <label>失效时间 <input type="datetime-local" v-model="imgEditValidUntil"></label>
            </div>
            <div class="form-row">
              <button class="btn btn-primary" @click="saveImgEdit">保存</button>
              <button class="btn btn-plain" @click="cancelImgEdit">取消</button>
            </div>
          </div>
        </div>

                  <button type="button" class="range-nav-btn" @click="pickerShiftMonth(-12)" aria-label="上一年">«</button>

                    <b>{{ pickerMonths[1].label }}</b>
                  </span>
                  <button type="button" class="range-nav-btn" @click="pickerShiftMonth(1)" aria-label="下一月">›</button>
                  <button type="button" class="range-nav-btn" @click="pickerShiftMonth(12)" aria-label="下一年">»</button>
                </div>
                <div class="range-cal-wrap">
                  <div v-for="cal in pickerMonths" :key="cal.label" class="range-cal">

                    <div class="range-grid">
                      <span v-for="n in cal.blanks" :key="'b' + n" class="range-cell empty"></span>

                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <span style="flex:1"></span>
          <span class="rt-pill" v-if="reportRealtime" title="当前排队情况，不受日期筛选影响">⏳ 等待接入 <b>{{ reportRealtime.queueWaiting }}</b></span>
          <span class="rt-pill" :class="{ 'queue-warning': reportRealtime && reportRealtime.queueOverdue > 0 }" v-if="reportRealtime" title="当前排队超过 10 分钟的会话">⚠ 排队超时 <b>{{ reportRealtime.queueOverdue }}</b></span>

        <div class="kpi-grid">

            <div class="kpi-icon cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
            <div class="kpi-body">
              <div class="kpi-label">有效咨询会话数</div>
              <div class="kpi-value">{{ formatCount(report.conversations) }}</div>

            </div>
          </div>
          <div class="kpi-card" title="期间有效留资客户数 ÷ 期间可识别咨询客户数。手机号格式正确、意向项目非空且登记未取消；按企业、客服号和渠道隔离去重，不代表预约成功。">
            <div class="kpi-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="m8 9 3 3 5-5"/></svg></div>
            <div class="kpi-body">
              <div class="kpi-label">有效留资率</div>
              <div class="kpi-value" :class="{'is-empty': report.leadRate == null}">{{ reportRate(report.leadRate) }}</div>
              <div class="kpi-note">{{ report.leadCustomers }} / {{ report.consultingCustomers }} 位客户</div>
            </div>
          </div>
          <div class="kpi-card" title="记录期内进入人工处理流程的咨询会话数 ÷ 记录期内有效咨询会话数，含等待接入。越低不一定越好，也不能据此推算问题解决率。">
            <div class="kpi-icon amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></div>
            <div class="kpi-body">
              <div class="kpi-label">转人工率</div>
              <div class="kpi-value" :class="{'is-empty': report.handoffRate == null}">{{ reportRate(report.handoffRate) }}</div>
              <div class="kpi-note">{{ report.handoffs }} / {{ report.handoffObservedConversations }} 个会话<span v-if="report.handoffPartial"><br>仅含有记录期间</span></div>
            </div>
          </div>
          <div class="kpi-card" title="知识不足回复数 ÷ 已分类的业务范围内回复数。超出业务范围、安全响应和业务信息待核实分别统计；历史未分类回复不计入分母。">
            <div class="kpi-icon rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3m0 3h.01"/></svg></div>
            <div class="kpi-body">
              <div class="kpi-label">知识不足率</div>
              <div class="kpi-value" :class="{'is-empty': report.knowledgeGapRate == null}">{{ reportRate(report.knowledgeGapRate) }}</div>
              <div class="kpi-note">{{ report.knowledgeGapReplies }} / {{ report.knowledgeEligibleReplies }} 条业务回复</div>
            </div>
          </div>
          <div class="kpi-card" title="服务端收到客户消息至首次成功发送有效回复的耗时。展示中位数和 P95；不含欢迎语、排队提示、发送失败及客户网络传输耗时。">
            <div class="kpi-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
            <div class="kpi-body">
              <div class="kpi-label">AI 首响（中位数）</div>
              <div class="kpi-value" :class="{'is-empty': report.firstResponseMedianMs == null}">{{ reportDuration(report.firstResponseMedianMs) }}</div>
              <div class="kpi-note">P95 {{ reportDuration(report.firstResponseP95Ms) }}<br>{{ report.responseSamples }} 次采样</div>
            </div>
          </div>
        </div>
        <details class="report-metric-details">

          <p>有效咨询按所选期间收到客户消息的会话去重。留资按可识别客户去重，要求同期间登记、手机号格式正确、意向项目非空且未取消；不代表预约成功。</p>

          <div class="report-reason-list" v-if="report.handoffReasons && report.handoffReasons.length">
            <span v-for="r in report.handoffReasons" :key="r.reason">{{ reportHandoffReason(r.reason) }} <b>{{ r.count }} 次转接</b></span>

            <span>知识不足 <b>{{ report.knowledgeGapReplies }} 条</b></span>

            <span>服务异常 <b>{{ report.errorReplies }} 条</b></span>
            <span>未分类 <b>{{ report.unclassifiedReplies }} 条</b></span>
          </div>
          <p>首响从服务端接收至首次成功发送有效回复，仅统计已采集的成功样本；P95 表示 95% 的样本在该时间内开始回复。没有样本时显示“暂无数据”。</p>
        </details>
      </div>

      <div class="report-mid">
      <div class="report-mid-main">
      <div class="card trend-card">
        <div class="trend-head">
          <div class="trend-title">
            <h2>消息量趋势（{{ trendRangeLabel }}）</h2>
          </div>
          <div v-if="daily.length" class="trend-summary" :aria-label="trendRangeLabel + '趋势摘要'">
            <div class="trend-stat"><span>{{ daily.length }} 天总消息</span><strong>{{ formatCount(trendTotal) }}<small>条</small></strong></div>
            <div class="trend-stat"><span>日均消息</span><strong>{{ trendAverage }}<small>条</small></strong></div>
            <div class="trend-stat"><span>单日峰值</span><strong>{{ formatCount(trendPeak.value) }}<small>{{ formatTrendDay(trendPeak.day) }}</small></strong></div>
            <div v-if="daily.length >= 14" class="trend-stat change" :class="trendPeriodChange.tone"><span>末 7 天较前 7 天</span><strong>{{ trendPeriodChange.text }}</strong></div>
          </div>
        </div>
        <div v-if="daily.length" class="trend-chart-frame" :class="{ 'trend-loading': trendLoading }">
          <div class="trend-legend">
            <div class="trend-legend-main"><span class="trend-legend-dot"></span><span>用户消息</span></div>
          </div>
          <div class="trend-chart-scroll">
            <div class="trend-wrap">
              <svg viewBox="0 0 700 205" role="img" :aria-label="`${trendRangeLabel}用户消息趋势，总计${trendTotal}条，最高${trendPeak.value}条`" @mousemove="onTrendMove" @mouseleave="onTrendLeave">
                <defs>
                  <linearGradient id="trend-fill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" :stop-color="trendGradColor" stop-opacity="0.30"/>
                    <stop offset="100%" :stop-color="trendGradColor" stop-opacity="0.015"/>
                  </linearGradient>
                  <filter id="trend-shadow" x="-30%" y="-30%" width="160%" height="180%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
                  </filter>
                </defs>
                <text x="58" y="20" font-size="8.5" fill="var(--ink-3)">消息数（条）</text>
                <g v-for="g in trendGrid" :key="g.value">
                  <line x1="58" :y1="g.y" x2="642" :y2="g.y" stroke="var(--line)" stroke-width="1" :stroke-dasharray="g.value === 0 ? null : '3 5'" :opacity="g.value === 0 ? 1 : .72"/>
                  <text x="49" :y="g.y + 3" text-anchor="end" font-size="8.5" fill="var(--ink-2)" font-variant-numeric="tabular-nums">{{ g.label }}</text>
                </g>
                <path :d="trendAreaPath" fill="url(#trend-fill)" pointer-events="none"/>
                <path :d="trendPath" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>
                <circle v-if="trendPeak" :cx="trendX(trendPeak.idx)" :cy="trendY(trendPeak.value)" r="7" fill="var(--brand-soft)" stroke="var(--brand-line)" stroke-width="1.25" pointer-events="none"/>
                <g v-for="(d, i) in daily" :key="d.day">
                  <circle class="trend-hit" :cx="trendX(i)" :cy="trendY(d.user_messages)" r="14" fill="transparent" style="cursor:pointer"

                  </text>
                </g>

              <p class="muted" style="margin:10px 0">规则风险分 {{ qualityDetail.ruleScore }}<span v-if="qualityDetail.judgeEnabled && qualityDetail.evaluationVersion==='semantic-v3'"> · {{ qualityJudgeModelLabel(qualityDetail) }}语义分 {{ qualityDetail.judgeScore }}</span><span v-else-if="qualityDetail.judgeEnabled"> · 历史评测结果</span><span v-else> · 非最终质量分</span></p>

              </div>
            </section>
          </div>
        </div>
      </div>

            <button class="btn btn-plain" @click="wecomTenantDialog = false">✕ 关闭</button>
          </div>
          <div class="kb-modal-body">
            <div class="wecom-wizard-steps" aria-label="新增企业步骤">
              <div class="wecom-wizard-step" :class="{active:newTenantStep===1,done:newTenantStep>1}"><b>{{ newTenantStep > 1 ? '✓' : '1' }}</b><span>企业信息</span></div>
              <div class="wecom-wizard-step" :class="{active:newTenantStep===2,done:newTenantStep>2}"><b>{{ newTenantStep > 2 ? '✓' : '2' }}</b><span>接口应用</span></div>
              <div class="wecom-wizard-step" :class="{active:newTenantStep===3}"><b>3</b><span>消息回调</span></div>
            </div>
            <div v-if="newTenantStep === 1" class="wecom-wizard-panel">
              <h3 class="wecom-wizard-title">确认企业身份</h3>
              <div class="tenant-form" style="margin-top:12px">
                <label class="account-field"><span class="wecom-field-label">企业编码 <span class="wecom-help" tabindex="0" data-tip="系统内部唯一标识，将成为回调 URL 的最后一段。创建后不可修改，建议使用品牌或地区的英文缩写。">?</span></span><input v-model.trim="newTenant.code" maxlength="50" placeholder="如 brand-shanghai"><small>3-50 位小写字母、数字或短横线，首尾不能是短横线</small></label>
                <label class="account-field"><span class="wecom-field-label">企业名称 <span class="wecom-help" tabindex="0" data-tip="仅用于管理后台展示，建议填写能区分主体或分公司的名称。">?</span></span><input v-model.trim="newTenant.name" maxlength="100" placeholder="如 上海分公司"></label>
                <label class="account-field"><span class="wecom-field-label">企业 ID（CorpID） <span class="wecom-help" tabindex="0" data-tip="获取路径：企业微信管理后台 → 我的企业 → 企业信息 → 企业 ID。通常以 ww 开头。">?</span></span><input v-model.trim="newTenant.corpId" maxlength="128" placeholder="ww..." autocomplete="off"><small>企业微信后台 → 我的企业 → 企业信息</small></label>
              </div>
            </div>
            <div v-else-if="newTenantStep === 2" class="wecom-wizard-panel">
              <h3 class="wecom-wizard-title">配置接口调用应用</h3>
              <div class="tenant-form" style="margin-top:12px">
                <label class="account-field full"><span class="wecom-field-label">接口调用应用 Secret <span class="wecom-help" tabindex="0" data-tip="先在应用管理中选择一个企业内部自建应用，再到微信客服的“可调用接口的应用”中授权该应用。这里填写这个自建应用的 Secret，不是微信客服独立版凭证。">?</span></span><input v-model.trim="newTenant.secret" type="password" autocomplete="new-password" placeholder="填写已获微信客服接口权限的自建应用 Secret"><small>应用管理 → 自建应用 → Secret；并确认该应用已获得微信客服接口权限</small></label>
              </div>
              <a class="btn btn-plain" href="https://work.weixin.qq.com/wework_admin/frame" target="_blank" rel="noopener noreferrer">前往企微后台配置 ↗</a>
            </div>
            <div v-else class="wecom-wizard-panel">
              <h3 class="wecom-wizard-title">配置接收消息</h3>
              <div class="wecom-preview"><span>回调 URL 预览（正式部署时应为公网 HTTPS 域名）</span><code>{{ newTenantCallbackPreview() }}</code></div>
              <div class="tenant-form">
                <label class="account-field"><span class="wecom-field-label">回调 Token <span class="wecom-help" tabindex="0" data-tip="由你在企微的接收消息配置中自定义，用于校验回调签名。企微后台与本系统必须逐字一致；它不是 access_token。">?</span></span><input v-model.trim="newTenant.callbackToken" type="password" maxlength="500" autocomplete="new-password" placeholder="与企微后台一致"></label>
                <label class="account-field"><span class="wecom-field-label">EncodingAESKey <span class="wecom-help" tabindex="0" data-tip="消息加解密密钥，通常可在企微接收消息配置中随机生成。必须是 43 位字母、数字、下划线或短横线，企微后台与本系统必须一致。">?</span></span><input v-model.trim="newTenant.aesKey" type="password" maxlength="43" autocomplete="new-password" placeholder="必须为 43 位"><small>当前 {{ (newTenant.aesKey || '').length }}/43 位</small></label>
              </div>
              <label class="switch-field"><span class="switch"><input type="checkbox" v-model="newTenant.enabled"><span class="slider"></span></span><span class="switch-text">创建后启用</span></label>
            </div>
            <div class="admin-account-actions" style="margin-top:14px;justify-content:space-between">
              <button v-if="newTenantStep > 1" class="btn btn-plain" @click="newTenantStep--">上一步</button><span v-else></span>
              <button v-if="newTenantStep < 3" class="btn btn-primary" @click="nextWeComTenantStep">下一步</button>
              <button v-else class="btn btn-primary" :disabled="wecomSaving" @click="createWeComTenant">{{ wecomSaving ? '创建中…' : '创建企业' }}</button>
            </div>
          </div>
        </div>
      </div>
      <div v-for="tenant in wecomTenants" :key="tenant.id" class="card tenant-card">
        <div class="tenant-head">
          <div><div class="tenant-title"><h2>{{ tenant.name }}</h2><span class="tenant-code">{{ tenant.code }}</span><span class="ai-status" :class="tenant.enabled ? 'matched' : 'failed'">{{ tenant.enabled ? '已启用' : '已停用' }}</span></div><p class="muted" style="margin-top:5px">CorpID：{{ tenant.corpId }} · {{ (tenant.accounts || []).length }} 个客服号</p></div>
          <div class="tenant-actions"><button class="btn btn-plain" @click="copyTenantCallback(tenant)">复制回调地址</button><button class="btn btn-primary" :disabled="tenant.checking" @click="diagnoseTenant(tenant)">{{ tenant.checking ? '正在检查…' : '一键检查接入状态' }}</button><button class="btn btn-danger" @click="deleteWeComTenant(tenant)">删除企业</button></div>
        </div>
        <div class="wecom-progress" aria-label="企业接入进度"><div v-for="step in wecomAccessSteps(tenant)" :key="step.number" class="wecom-progress-step" :class="{done:step.done,current:step.current}"><span>{{ step.done ? '✓' : step.number }} {{ step.label }}</span><small>{{ step.detail }}</small></div></div>
        <div class="wecom-callback"><code :title="tenant.callbackUrl">{{ tenant.callbackUrl }}</code></div>
        <div class="secret-state"><span :class="{ready:tenant.secretConfigured}">Secret {{ tenant.secretConfigured ? '已配置' : '未配置' }}</span><span :class="{ready:tenant.callbackTokenConfigured}">Token {{ tenant.callbackTokenConfigured ? '已配置' : '未配置' }}</span><span :class="{ready:tenant.aesKeyConfigured}">AESKey {{ tenant.aesKeyConfigured ? '已配置' : '未配置' }}</span></div>
        <details class="wecom-advanced">
          <summary>编辑企业配置与凭证</summary>
          <div class="wecom-advanced-body">
            <div class="tenant-form">
              <label class="account-field"><span>企业编码</span><input v-model="tenant.draft.code" disabled title="企业编码创建后不可修改（企微回调地址按此编码配置）"></label>
              <label class="account-field"><span>企业名称</span><input v-model="tenant.draft.name"></label>
              <label class="account-field"><span class="wecom-field-label">企业 ID（CorpID） <span class="wecom-help" tabindex="0" data-tip="企业微信后台 → 我的企业 → 企业信息 → 企业 ID。修改错误会导致接口鉴权和回调解密失败。">?</span></span><input v-model="tenant.draft.corpId"></label>
              <label class="account-field"><span class="wecom-field-label">替换接口调用应用 Secret <span class="wecom-help" tabindex="0" data-tip="留空会保留现有 Secret。新值必须属于已获得微信客服接口权限的企业内部自建应用。">?</span></span><input v-model="tenant.draft.secret" type="password" autocomplete="new-password" placeholder="留空保持当前值"></label>
              <label class="account-field"><span class="wecom-field-label">替换回调 Token <span class="wecom-help" tabindex="0" data-tip="留空会保留现有 Token；填写时必须与企微微信客服 API 的接收消息配置完全一致。">?</span></span><input v-model="tenant.draft.callbackToken" type="password" autocomplete="new-password" placeholder="留空保持当前值"></label>
              <label class="account-field"><span class="wecom-field-label">替换 EncodingAESKey <span class="wecom-help" tabindex="0" data-tip="留空会保留现有密钥；替换值必须是企微接收消息配置中的 43 位 EncodingAESKey。">?</span></span><input v-model="tenant.draft.aesKey" type="password" maxlength="43" autocomplete="new-password" placeholder="留空保持当前值"></label>
            </div>
            <div class="admin-account-actions"><label class="switch-field"><span class="switch"><input type="checkbox" v-model="tenant.draft.enabled"><span class="slider"></span></span><span class="switch-text">启用企业</span></label><button class="btn btn-primary" :disabled="wecomSaving" @click="saveWeComTenant(tenant)">保存企业配置</button></div>
          </div>
        </details>

        <div v-if="tenant.diagnostics" class="tenant-diagnostics">
          <div class="tenant-head" style="margin:0"><div><strong>{{ tenant.diagnostics.summary }}</strong><p class="muted">不会发送客户消息；收到有效回调后才显示“已连接”。</p></div><span class="wecom-overall" :class="tenant.diagnostics.overall">{{ tenant.diagnostics.statusLabel || '待完善' }}</span></div>
          <p class="wecom-next-action"><strong>下一步：</strong>{{ tenant.diagnostics.nextAction }}</p>
          <div class="wecom-runtime"><div><span>本进程有效回调</span><strong>{{ tenant.diagnostics.runtime.callbacksAccepted || 0 }}</strong></div><div><span>最近有效回调</span><strong style="font-size:13px">{{ formatWeComTime(tenant.diagnostics.runtime.lastAcceptedCallbackAt) }}</strong></div><div><span>本进程收到回调</span><strong>{{ tenant.diagnostics.runtime.callbacksReceived || 0 }}</strong></div><div><span>监控开始时间</span><strong style="font-size:13px">{{ formatWeComTime(tenant.diagnostics.runtime.startedAt) }}</strong></div></div>
          <div class="wecom-check-grid"><div v-for="check in tenant.diagnostics.checks" :key="check.key" class="wecom-check" :class="{passed:check.passed}"><span class="wecom-check-mark">{{ check.passed ? '✓' : '!' }}</span><div><b>{{ check.label }}</b><small>{{ check.detail }}</small></div></div></div>
        </div>

        <section class="kf-section">
          <div class="kf-section-head"><div><h3>微信客服号</h3><p class="muted">同步不会覆盖本地业务配置；新账号默认停用。</p></div><button class="btn btn-primary" :disabled="tenant.syncing || tenant.checking || !tenant.enabled" @click="syncWeComAccounts(tenant)">{{ tenant.syncing ? '同步中…' : '从企微同步客服号' }}</button></div>
          <details class="wecom-advanced">
            <summary>高级操作：手动添加客服号</summary>
            <div class="wecom-advanced-body">
              <div class="tenant-form">
                <label class="account-field"><span class="wecom-field-label">open_kfid <span class="wecom-help" tabindex="0" data-tip="微信客服账号的唯一标识，由企微接口返回，通常以 wk 开头。优先使用自动同步，避免手工复制错误。">?</span></span><input v-model="tenant.newAccount.openKfid" placeholder="wk... 或客服号标识"></label>
                <label class="account-field"><span>客服号名称</span><input v-model="tenant.newAccount.name" placeholder="如 抗衰客服"></label>
                <label class="account-field"><span>业务范围</span><input v-model="tenant.newAccount.businessScope" placeholder="如 仅回答抗衰项目"></label>
                <label class="account-field full"><span>独立欢迎语（留空使用全局欢迎语）</span><textarea v-model="tenant.newAccount.welcomeMessage" placeholder="该客服号客户进入会话时发送"></textarea></label>
              </div>
              <div class="admin-account-actions"><label class="switch-field"><span class="switch"><input type="checkbox" v-model="tenant.newAccount.enabled"><span class="slider"></span></span><span class="switch-text">创建后启用</span></label><button class="btn btn-primary" @click="createWeComAccount(tenant)">添加客服号</button></div>
            </div>
          </details>
          <div v-for="account in tenant.accounts" :key="account.id" class="kf-account">
            <div class="kf-account-head"><strong>{{ account.name }} <span class="muted">{{ account.openKfid }}</span></strong><div class="tenant-actions"><span class="ai-status" :class="account.enabled ? 'matched' : 'failed'">{{ account.enabled ? '已启用' : '已停用' }}</span><button class="btn btn-danger" @click="deleteWeComAccount(tenant, account)">删除</button></div></div>
            <div class="tenant-form">
              <label class="account-field"><span>open_kfid</span><input v-model="account.draft.openKfid"></label>
              <label class="account-field"><span>客服号名称</span><input v-model="account.draft.name"></label>
              <label class="account-field"><span>业务范围</span><input v-model="account.draft.businessScope"></label>
              <label class="account-field full"><span>独立欢迎语</span><textarea v-model="account.draft.welcomeMessage" placeholder="留空使用全局欢迎语"></textarea></label>
            </div>
            <div class="admin-account-actions"><label class="switch-field"><span class="switch"><input type="checkbox" v-model="account.draft.enabled"><span class="slider"></span></span><span class="switch-text">启用客服号</span></label><button class="btn btn-primary" @click="saveWeComAccount(tenant, account)">保存客服号</button></div>
          </div>
        </section>
      </div>
    </div>

    <!-- 超级管理员：动态主备聊天模型 -->
    <div v-if="role === 'super_admin' && tab === 'models'" class="model-page">
      <section class="model-hero">
        <div>
          <span class="chip chip-done">OpenAI 兼容协议</span>
          <h2>聊天模型与主备切换</h2>
        </div>
        <div class="model-hero-actions">
          <button class="btn btn-primary" @click="openAiModelDialog()">＋ 添加新模型</button>
        </div>
      </section>

      <section class="model-route" aria-label="当前模型调用顺序">
        <article class="model-route-card primary">
          <div class="model-route-label"><span>① 优先调用 · 主模型</span><span class="ai-status" :class="modelSummary.primary && modelSummary.primary.apiKeyConfigured ? 'matched' : 'failed'">{{ modelSummary.primary && modelSummary.primary.apiKeyConfigured ? '可调用' : '缺少 Key' }}</span></div>
          <h3>{{ (modelSummary.primary && modelSummary.primary.displayName) || '尚未设置' }}</h3>
          <code>{{ (modelSummary.primary && modelSummary.primary.modelName) || '—' }}</code>
        </article>
        <div class="model-route-arrow" aria-hidden="true">→</div>
        <article class="model-route-card fallback">
          <div class="model-route-label"><span>② 主模型失败后 · 备用模型</span><span class="ai-status" :class="modelSummary.fallback && modelSummary.fallback.apiKeyConfigured ? 'matched' : 'failed'">{{ modelSummary.fallback && modelSummary.fallback.apiKeyConfigured ? '可调用' : '缺少 Key' }}</span></div>
          <h3>{{ (modelSummary.fallback && modelSummary.fallback.displayName) || '尚未设置' }}</h3>
          <code>{{ (modelSummary.fallback && modelSummary.fallback.modelName) || '—' }}</code>
        </article>
      </section>

      <section class="card">
        <div class="model-list-head"><div><h2>模型列表（共 {{ aiModels.length }} 个）</h2></div><button class="btn btn-plain" :disabled="modelLoading" @click="loadAiModels">{{ modelLoading ? '刷新中…' : '刷新' }}</button></div>
        <table>
          <tr><th scope="col">模型</th><th scope="col">接口地址</th><th scope="col">角色</th><th scope="col">状态</th><th scope="col">操作</th></tr>
          <tr v-if="!aiModels.length"><td colspan="5" class="empty-row">暂无模型配置，请添加一个 OpenAI 兼容模型</td></tr>
          <tr v-for="model in pagedAiModels" :key="model.id">
            <td><div class="model-name"><strong>{{ model.displayName }}</strong><small>{{ model.modelName }}</small></div></td>
            <td><div class="model-endpoint"><code :title="model.baseUrl">{{ model.baseUrl }}</code><small>{{ model.protocol === 'openai-compatible' ? 'OpenAI 兼容' : model.protocol }}</small></div></td>
            <td><span class="model-role" :class="model.role">{{ aiModelRoleLabel(model.role) }}</span></td>
            <td><div class="model-status"><span :class="model.enabled ? 'ready' : 'missing'">{{ model.enabled ? '● 已启用' : '○ 已停用' }}</span><span :class="model.apiKeyConfigured ? 'ready' : 'missing'">{{ model.apiKeyConfigured ? 'Key 已配置' : 'Key 未配置' }}</span><small v-if="model.keySource" class="muted">{{ model.keySource }}</small><small v-if="modelTestResults[model.id]" :class="modelTestResults[model.id].passed ? 'ready' : 'missing'" :title="modelTestResults[model.id].message">{{ modelTestResults[model.id].passed ? `综合通过 · 基础 ${modelTestResults[model.id].basicLatencyMs}ms / 评测 ${modelTestResults[model.id].qualityLatencyMs}ms` : '综合未通过（悬停查看原因）' }}</small></div></td>
            <td><div class="model-actions">
              <button class="btn btn-plain" @click="openAiModelDialog(model)">编辑</button>
              <button class="btn btn-plain" title="先测试基础聊天，再用当前真实评测 Prompt 测试 JSON 评分能力" :disabled="modelTestingId===model.id || !model.apiKeyConfigured" @click="testAiModel(model)">{{ modelTestingId===model.id ? '综合测试中…' : '综合测试' }}</button>
              <button class="btn btn-primary" v-if="model.role!=='eval'" :disabled="model.role==='primary' || !model.enabled || !model.apiKeyConfigured" @click="assignAiModelRole(model,'primary')">设为主模型</button>
              <button class="btn btn-plain" v-if="model.role!=='eval'" :disabled="model.role==='fallback' || !model.enabled || !model.apiKeyConfigured" @click="assignAiModelRole(model,'fallback')">设为备用</button>
              <button class="btn btn-plain" v-if="model.role!=='eval'" :disabled="model.role==='eval'" @click="assignAiModelRole(model,'eval')" title="把本模型设为评测专用，供质量评测页面选择使用">设为评测专用</button>
              <button class="btn btn-plain" :disabled="model.role==='candidate'" @click="assignAiModelRole(model,'candidate')" title="把本模型从当前角色降级为普通候选，降级后即可停用或删除">设为普通候选</button>
              <span class="btn-tip" :title="(model.role==='primary'||model.role==='fallback') ? '主模型/备用模型不可停用：请先点“设为普通候选”降级后再停用' : ''">
                <button class="btn" :class="model.enabled ? 'btn-danger' : 'btn-plain'" :disabled="model.role==='primary' || model.role==='fallback'" @click="toggleAiModel(model)">{{ model.enabled ? '停用' : '启用' }}</button>
              </span>
              <span class="btn-tip" :title="(model.role==='primary'||model.role==='fallback') ? '主模型/备用模型不可删除：请先点“设为普通候选”降级后再删除' : ''">
                <button class="btn btn-danger" :disabled="model.role==='primary' || model.role==='fallback'" @click="deleteAiModel(model)">删除</button>
              </span>
            </div></td>
          </tr>
        </table>
        <div v-if="totalAiModelPages > 1" class="pager">
          <button class="btn btn-plain" :disabled="modelPage<=1" @click="modelPage--">上一页</button>
          <span class="muted">第 {{ modelPage }} / {{ totalAiModelPages }} 页 · 共 {{ aiModels.length }} 个模型</span>
          <button class="btn btn-plain" :disabled="modelPage>=totalAiModelPages" @click="modelPage++">下一页</button>
        </div>
      </section>

      <!-- 统一模型管理：视觉 / 向量模型 + 通义密钥，全部在模型管理页维护 -->
      <section class="model-endpoint-section">
        <div class="model-list-head"><div><h2>非对话模型（视觉 / 向量）</h2></div></div>
        <div class="model-endpoint-grid">
          <div class="model-endpoint-card accent-vision">
            <h3><span class="model-endpoint-badge"><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="currentColor"/></svg>视觉</span>图片理解 / OCR</h3>
            <label class="account-field full"><span>接口地址</span><input v-model="cfgVisionBase.value" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1"></label>
            <label class="account-field full"><span>模型名称</span><input v-model="cfgVisionName.value" placeholder="qwen-vl-max"></label>
            <template v-for="item in settingKeys.filter(k => k.key === 'model.vision.apiKey')" :key="item.key">
              <label class="account-field full key-wrap"><span>API Key</span><input :type="revealedKeys[item.key] ? 'text' : 'password'" v-model="settingValues[item.key]" :placeholder="item.configured ? '已配置；输入新值可替换' : (item.desc||'留空则回退通义 Key')" autocomplete="new-password"><button v-if="role === 'super_admin' && item.configured" type="button" class="key-eye" :title="revealedKeys[item.key] ? '隐藏密钥' : '查看密钥'" @click="toggleRevealSetting(item)"><svg v-if="!revealedKeys[item.key]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg v-else width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></label>

      <div class="dialog-actions"><button type="button" class="btn-dialog-cancel" @click="resolveConfirm(false)">取消</button><button type="button" class="btn-dialog-primary" @click="resolveConfirm(true)">确认</button></div>
    </div>
  </div>
  </template>
</div>
